const XLSX_LIB = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) xlsxPromise = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = XLSX_LIB; sc.async = true;
    sc.onload = () => ok(window.XLSX);
    sc.onerror = () => { xlsxPromise = null; sc.remove(); fail(new Error('xlsx')); };
    document.head.appendChild(sc);
  });
  return xlsxPromise;
}
function toDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function monthName(k) { const [y, m] = k.split('-').map(Number); return `${MONTHS[m - 1]}/${y}`; }

function buildSheet(XLSX, header, rows, cols) {
  // cols: [{w: largura, fmt: 'money'|'date'|'pct'|null}]
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows], { cellDates: true });
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let r = 1; r <= range.e.r; r++) {
    cols.forEach((c, ci) => {
      const cell = ws[XLSX.utils.encode_cell({ r, c: ci })];
      if (!cell) return;
      if (c.fmt === 'money') cell.z = '"R$" #,##0.00;[Red]-"R$" #,##0.00';
      if (c.fmt === 'date') cell.z = 'dd/mm/yyyy';
      if (c.fmt === 'pct') cell.z = '0%';
    });
  }
  ws['!cols'] = cols.map(c => ({ wch: c.w }));
  ws['!autofilter'] = { ref: ws['!ref'] };
  return ws;
}

async function exportExcel(scope, btn) {
  const keys = scope === 'mes' ? [mk()] : Object.keys(loadAll()).filter(k => /^\d{4}-\d{2}$/.test(k) && monthHasData(loadAll()[k])).sort();
  if (!keys.length || !keys.some(k => monthHasData(peekMonth(k)))) return toast('Nada para exportar ainda');
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = 'Gerando…'; }
  try {
    const XLSX = await loadXLSX();
    const lanc = [], resumo = [], rec = [], meses = [];
    keys.forEach(k => {
      const d = peekMonth(k), mn = monthName(k);
      const G = sum(d.lancamentos, 'valor'), R = sum(d.receitas, 'valor'), O = sum(d.categorias, 'orcamento');
      [...d.lancamentos].sort((a, b) => a.data.localeCompare(b.data)).forEach(l => {
        const c = catOf(d, l);
        lanc.push([toDate(l.data), l.desc || '', c ? c.nome : 'Sem categoria', Number(l.valor) || 0, mn]);
      });
      d.categorias.forEach(c => {
        const u = usedBy(d, c.id), o = Number(c.orcamento) || 0;
        resumo.push([mn, c.nome, o, u, o - u, o > 0 ? u / o : null]);
      });
      const orphan = d.lancamentos.filter(l => !catOf(d, l)).reduce((s, l) => s + (l.valor || 0), 0);
      if (orphan) resumo.push([mn, 'Sem categoria', 0, orphan, -orphan, null]);
      d.receitas.forEach(r => rec.push([mn, r.nome, Number(r.valor) || 0]));
      meses.push([mn, R, O, G, R - G, R - O]);
    });

    const wb = XLSX.utils.book_new();
    if (scope === 'tudo') XLSX.utils.book_append_sheet(wb, buildSheet(XLSX,
      ['Mês', 'Receitas', 'Orçado', 'Gasto', 'Saldo (receitas − gasto)', 'Sobra planejada'], meses,
      [{ w: 16 }, { w: 14, fmt: 'money' }, { w: 14, fmt: 'money' }, { w: 14, fmt: 'money' }, { w: 22, fmt: 'money' }, { w: 16, fmt: 'money' }]), 'Meses');
    XLSX.utils.book_append_sheet(wb, buildSheet(XLSX,
      ['Data', 'Descrição', 'Categoria', 'Valor', 'Mês'], lanc,
      [{ w: 12, fmt: 'date' }, { w: 30 }, { w: 18 }, { w: 14, fmt: 'money' }, { w: 16 }]), 'Lançamentos');
    XLSX.utils.book_append_sheet(wb, buildSheet(XLSX,
      ['Mês', 'Categoria', 'Orçado', 'Gasto', 'Saldo', '% usado'], resumo,
      [{ w: 16 }, { w: 20 }, { w: 14, fmt: 'money' }, { w: 14, fmt: 'money' }, { w: 14, fmt: 'money' }, { w: 10, fmt: 'pct' }]), 'Categorias');
    XLSX.utils.book_append_sheet(wb, buildSheet(XLSX,
      ['Mês', 'Receita', 'Valor'], rec,
      [{ w: 16 }, { w: 24 }, { w: 14, fmt: 'money' }]), 'Receitas');

    const name = scope === 'mes' ? `financas-${mk()}.xlsx` : `financas-completo-${today()}.xlsx`;
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true });
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const file = new File([blob], name, { type: blob.type });

    // No celular: abre o menu de compartilhar (salvar em Arquivos, WhatsApp, e-mail…)
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); toast('Planilha pronta ✓'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Planilha baixada ✓');
  } catch (e) {
    console.warn(e);
    toast('Não consegui gerar a planilha. Verifique a internet e tente de novo.');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = old; }
  }
}

function schedulePush() {

async function pushNow() {

  if (!navigator.onLine) { setSync('offline'); return; }
  syncing = true; setSync('syncing');
  const s = loadAll(), snap = {};
  keys.forEach(k => { snap[k] = s[k] === undefined ? undefined : JSON.stringify(s[k]); });
  try {
    const now = new Date().toISOString();
    const up = keys.filter(k => snap[k] !== undefined).map(k => ({ user_id: user.id, month: k, data: JSON.parse(snap[k]), updated_at: now }));
    const del = keys.filter(k => snap[k] === undefined);
    if (up.length) { const { error } = await sb.from(TABLE).upsert(up); if (error) throw error; }
    if (del.length) { const { error } = await sb.from(TABLE).delete().in('month', del); if (error) throw error; }
    keys.forEach(k => { if (snap[k] === undefined) delete synced[k]; else synced[k] = snap[k]; });

    syncing = false;
    if (dirtyKeys().length) schedulePush(); else setSync('ok');
  } catch (e) {

async function fetchRemote() {
  const { data, error } = await sb.from(TABLE).select('month,data');
  if (error) throw error;
  const remote = {};
  (data || []).forEach(r => { remote[r.month] = r.data; });

}
async function pull() {
  if (!sb || !user || appMode() !== 'cloud') return;
  if (!navigator.onLine) { setSync('offline'); return; }
  try {
    setSync('syncing');
    const remote = await fetchRemote();
    const s = loadAll(); let changed = false;
    for (const [k, v] of Object.entries(remote)) {
      const lj = JSON.stringify(s[k] ?? null), rj = JSON.stringify(v);
      const localDirty = lj !== (synced[k] ?? 'null');
      if (!localDirty) { if (lj !== rj) { s[k] = v; changed = true; } synced[k] = rj; }
      else if (lj === rj) synced[k] = rj;
    }
    for (const k of Object.keys(synced)) {
      if (k in remote) continue;
      const localDirty = JSON.stringify(s[k] ?? null) !== synced[k];
      if (!localDirty && s[k] !== undefined) { delete s[k]; changed = true; }
      delete synced[k];
    }
    saveSynced(); lastPull = Date.now();
    if (changed) { persistLocal(); ANIM = false; refresh(); }
    if (dirtyKeys().length) schedulePush(); else setSync('ok');
  } catch (e) {
    console.warn('sync pull', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  }
}

function mergeMonth(a = {}, b = {}) {
  const out = {};
  ['receitas', 'categorias', 'lancamentos'].forEach(f => {
    const map = new Map();
    (b[f] || []).forEach(x => map.set(x.id, x));
    (a[f] || []).forEach(x => map.set(x.id, x)); // aparelho vence em caso de mesmo id
    out[f] = [...map.values()];
  });
  return out;
}
function resolveMerge(choice) {

  else {

    Object.keys(local).filter(isSyncKey).forEach(k => {
      out[k] = k === '_meta' ? { ...(remote._meta || {}), ...local._meta } : (remote[k] ? mergeMonth(local[k], remote[k]) : local[k]);
    });
    store = out;
  }

  toast(choice === 'remote' ? 'Dados da conta carregados ✓' : 'Tudo junto e sincronizado ✓');

  if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar".';
  if (/not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar — veja sua caixa de entrada (e o spam).';
  if (/password.*(6|characters|short)/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/email rate limit/i.test(m)) return 'O limite de e-mails de confirmação por hora foi atingido. Tente de novo mais tarde.';
  const secs = m.match(/after (\d+) seconds/i);
  if (secs) return `Aguarde ${secs[1]} segundos e tente de novo.`;
  if (/rate limit|too many|security purposes/i.test(m)) return 'Muitas tentativas. Aguarde um minuto e tente de novo.';
  if (/invalid.*email|email.*invalid/i.test(m)) return 'E-mail inválido.';
  if (/fetch|network/i.test(m)) return 'Sem conexão. Verifique sua internet.';
  return m || 'Algo deu errado. Tente novamente.';
}
async function submitAuth() {
  const email = $('#a-email').value.trim(), password = $('#a-pass').value;
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg('Digite um e-mail válido.', 'err');
  if (password.length < 6) return authMsg('A senha precisa ter pelo menos 6 caracteres.', 'err');
  if (!sb) return authMsg('Sem conexão com o servidor. Verifique sua internet e recarregue.', 'err');
  const btn = $('#a-btn'), label = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  LS.set('fin_email', email);
  try {
    if (authTab === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: APP_URL } });
      if (error) throw error;
      if (!data.session) {
        authTab = 'login'; renderAuth();
        authMsg(`Conta criada! Enviamos um link de confirmação para ${email}. Abra o e-mail, toque no link e depois entre aqui.`, 'ok');
        return;
      }
    }
  } catch (e) { authMsg(trError(e), 'err'); }
  finally { const b = $('#a-btn'); if (b) { b.disabled = false; b.textContent = label; } }
}
async function forgotPassword() {
  const email = $('#a-email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return authMsg('Digite seu e-mail acima e toque de novo em "Esqueci minha senha".', 'err');
  if (!sb) return authMsg('Sem conexão com o servidor.', 'err');
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
  if (error) authMsg(trError(error), 'err');
  else authMsg(`Enviamos um link para ${email}. Abra o e-mail para criar uma nova senha.`, 'ok');
}
async function saveNewPassword(btn) {
  const password = $('#f-pass').value;
  if (password.length < 6) return invalid('f-pass', 'Mínimo de 6 caracteres');
  btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password });
  btn.disabled = false;
  if (error) return toast(trError(error));
  closeSheet(); toast('Senha alterada ✓');
}
function useLocal() {
  LS.set('fin_mode', 'local'); hideAuth(); setSync('idle');
  toast('Modo sem conta: dados só neste aparelho');
  if (isMobile) maybeShowBanner();
}
async function logout() {
  if (dirtyKeys().length) {
    await pushNow();
    if (dirtyKeys().length && !confirm('Algumas alterações ainda não foram enviadas (sem internet). Se sair agora, elas serão perdidas. Sair mesmo assim?')) return;
  }
  closeSheet();
  try { await sb.auth.signOut(); } catch {}
  signedOutCleanup();
}
function signedOutCleanup() {
  user = null; store = {}; persistLocal(); synced = {}; saveSynced();
  LS.del('fin_owner'); LS.del('fin_mode');
  Object.keys(lastVals).forEach(k => delete lastVals[k]);
  ANIM = true; refresh(); setSync('idle');
  showAuth();
}
function accountHTML() {
  if (appMode() === 'cloud' && user) {
    return `<div class="account">
        <div class="avatar">${esc((user.email || '?')[0].toUpperCase())}</div>
        <div class="account-info"><b>${esc(user.email)}</b><span id="sync-label">${syncLabel()}</span></div>
      </div>
      <div class="btn-row" style="margin-bottom:22px">
        <button class="btn-soft" onclick="syncNow()">Sincronizar</button>
        <button class="btn-soft" onclick="logout()">Sair da conta</button>
      </div>`;
  }
  if (appMode() === 'cloud') {
    return `<div class="account"><div class="avatar">◆</div><div class="account-info"><b>${esc(LS.get('fin_email') || 'Sua conta')}</b><span>Conectando… (sem internet?)</span></div></div><div style="height:12px"></div>`;
  }
  return `<div class="account"><div class="avatar">◆</div><div class="account-info"><b>Sem conta</b><span>Dados salvos só neste aparelho</span></div></div>
    <button class="btn-primary" style="margin:0 0 22px" onclick="showAuth()">Entrar ou criar conta</button>`;
}
async function syncNow() { await pushNow(); await pull(); toast(syncState === 'ok' ? 'Tudo sincronizado ✓' : syncLabel()); }

// ---- ciclo de vida ----
async function handleAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    user = session?.user || user;
    LS.set('fin_mode', 'cloud'); hideAuth();
    openSheet('nova-senha');
    return;
  }
  if (session?.user) {
    const isNew = !user || user.id !== session.user.id;
    user = session.user;
    if (!isNew) return;
    LS.set('fin_mode', 'cloud'); LS.set('fin_email', user.email || '');
    hideAuth(); setSync('syncing');
    if (isMobile) maybeShowBanner();
    if (LS.get('fin_owner') && LS.get('fin_owner') !== user.id) { store = {}; persistLocal(); synced = {}; saveSynced(); }
    if (LS.get('fin_owner') !== user.id) await firstSync();
    else { await pushNow(); await pull(); }
    return;
  }
  if (event === 'SIGNED_OUT' && user) { signedOutCleanup(); return; }
  if (event === 'INITIAL_SESSION') {
    if (appMode() === 'cloud') {
      if (!navigator.onLine) { setSync('offline'); return; } // sem internet: segue com os dados do aparelho
      user = null; LS.set('fin_mode', '');
      showAuth('Sua sessão expirou. Entre novamente — seus dados estão salvos na nuvem.');
    } else if (appMode() !== 'local') showAuth();
  }
}
function initCloud() {
  if (!window.supabase || !window.supabase.createClient) {
    setSync('offline');
    if (!appMode()) showAuth('Sem conexão com o servidor agora. Você pode usar sem conta e entrar depois.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleAuth(event, session), 0); });
}
function loadCloudLib() {
  const sc = document.createElement('script');
  sc.src = SUPABASE_LIB; sc.async = true;
  sc.onload = initCloud; sc.onerror = initCloud;
  document.head.appendChild(sc);
}
window.addEventListener('online', () => { if (appMode() === 'cloud') { pushNow().then(pull); } });
window.addEventListener('offline', () => { if (appMode() === 'cloud') setSync('offline'); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && appMode() === 'cloud' && Date.now() - lastPull > 20000) pull();
});

// ═════════════════════════════════════════════
// INSTALAÇÃO (PWA)
// ═════════════════════════════════════════════
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android/i.test(navigator.userAgent);
function isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
let installPrompt = null, bannerTimer = null;

function installDismissed() {
  try { return Date.now() - (+localStorage.getItem('fin_install_dismiss') || 0) < 21 * 864e5; } catch { return false; }
}
function maybeShowBanner() {
  if (isStandalone() || installDismissed()) return;
  if (!installPrompt && !isMobile) return;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $('#install-banner').classList.add('show'), 2500);
}
function hideBanner() { clearTimeout(bannerTimer); $('#install-banner').classList.remove('show'); }
function dismissInstall() {
  try { localStorage.setItem('fin_install_dismiss', String(Date.now())); } catch {}
  hideBanner();
}
async function installApp() {
  hideBanner();
  if (installPrompt) {
    closeSheet();
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome !== 'accepted') dismissInstall();
  } else {
    openSheet('instalar');
  }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; maybeShowBanner(); });
window.addEventListener('appinstalled', () => { hideBanner(); toast('App instalado ✓'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // procura versão nova ao abrir e sempre que o app volta para a tela
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  // quando uma versão nova é instalada, oferece atualizar
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    toast('Nova versão do app disponível', { label: 'Atualizar', fn: () => { reloading = true; location.reload(); } });
  });
}

// ═════════════════════════════════════════════
// INÍCIO
// ═════════════════════════════════════════════
loadSynced();
refresh();
setSync(appMode() === 'cloud' ? (navigator.onLine ? 'idle' : 'offline') : 'idle');
if (!appMode()) showAuth();
else if (isMobile && appMode() === 'local') maybeShowBanner();
loadCloudLib();
</script>
</body>
</html>
