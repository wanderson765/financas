function schedulePush() {

async function pushNow() {

  const keys = dirtyKeys();

  const s = loadAll(), snap = {};
  keys.forEach(k => { snap[k] = s[k] === undefined ? undefined : JSON.stringify(s[k]); });
  try {
    const now = new Date().toISOString();
    const up = keys.filter(k => snap[k] !== undefined).map(k => ({ user_id: user.id, month: k, data: JSON.parse(snap[k]), updated_at: now }));
    const del = keys.filter(k => snap[k] === undefined);
    if (up.length) { const { error } = await sb.from(TABLE).upsert(up); if (error) throw error; }
    if (del.length) { const { error } = await sb.from(TABLE).delete().in('month', del); if (error) throw error; }
    keys.forEach(k => { if (snap[k] === undefined) delete synced[k]; else synced[k] = snap[k]; });

    syncing = false;
    if (dirtyKeys().length) schedulePush(); else setSync('ok');
  } catch (e) {
    console.warn('sync push', e);

    setSync(navigator.onLine ? 'error' : 'offline');

async function fetchRemote() {
  const { data, error } = await sb.from(TABLE).select('month,data');
  if (error) throw error;
  const remote = {};
  (data || []).forEach(r => { remote[r.month] = r.data; });

}
async function pull() {
  if (!sb || !user || appMode() !== 'cloud') return;
  if (!navigator.onLine) { setSync('offline'); return; }
  try {
    setSync('syncing');
    const remote = await fetchRemote();
    const s = loadAll(); let changed = false;
    for (const [k, v] of Object.entries(remote)) {
      const lj = JSON.stringify(s[k] ?? null), rj = JSON.stringify(v);
      const localDirty = lj !== (synced[k] ?? 'null');
      if (!localDirty) { if (lj !== rj) { s[k] = v; changed = true; } synced[k] = rj; }
      else if (lj === rj) synced[k] = rj;
    }
    for (const k of Object.keys(synced)) {
      if (k in remote) continue;
      const localDirty = JSON.stringify(s[k] ?? null) !== synced[k];
      if (!localDirty && s[k] !== undefined) { delete s[k]; changed = true; }
      delete synced[k];
    }
    saveSynced(); lastPull = Date.now();
    if (changed) { persistLocal(); ANIM = false; refresh(); }
    if (dirtyKeys().length) schedulePush(); else setSync('ok');
  } catch (e) {
    console.warn('sync pull', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  }
}

function mergeMonth(a = {}, b = {}) {
  const out = {};
  ['receitas', 'categorias', 'lancamentos'].forEach(f => {
    const map = new Map();
    (b[f] || []).forEach(x => map.set(x.id, x));
    (a[f] || []).forEach(x => map.set(x.id, x)); // aparelho vence em caso de mesmo id
    out[f] = [...map.values()];
  });

}
function resolveMerge(choice) {

    Object.keys(local).filter(isSyncKey).forEach(k => {
      out[k] = k === '_meta' ? { ...(remote._meta || {}), ...local._meta } : (remote[k] ? mergeMonth(local[k], remote[k]) : local[k]);

async function handleAuth(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    user = session?.user || user;
    LS.set('fin_mode', 'cloud'); hideAuth();
    openSheet('nova-senha');
    return;
  }
  if (session?.user) {
    const isNew = !user || user.id !== session.user.id;
    user = session.user;
    if (!isNew) return;
    LS.set('fin_mode', 'cloud'); LS.set('fin_email', user.email || '');
    hideAuth(); setSync('syncing');
    if (isMobile) maybeShowBanner();
    if (LS.get('fin_owner') && LS.get('fin_owner') !== user.id) { store = {}; persistLocal(); synced = {}; saveSynced(); }
    if (LS.get('fin_owner') !== user.id) await firstSync();
    else { await pushNow(); await pull(); }
    return;
  }
  if (event === 'SIGNED_OUT' && user) { signedOutCleanup(); return; }
  if (event === 'INITIAL_SESSION') {
    if (appMode() === 'cloud') {
      if (!navigator.onLine) { setSync('offline'); return; } // sem internet: segue com os dados do aparelho
      user = null; LS.set('fin_mode', '');
      showAuth('Sua sessão expirou. Entre novamente — seus dados estão salvos na nuvem.');
    } else if (appMode() !== 'local') showAuth();

function loadCloudLib() {
  const sc = document.createElement('script');
  sc.src = SUPABASE_LIB; sc.async = true;
  sc.onload = initCloud; sc.onerror = initCloud;
  document.head.appendChild(sc);
}
window.addEventListener('online', () => { if (appMode() === 'cloud') { pushNow().then(pull); } });
window.addEventListener('offline', () => { if (appMode() === 'cloud') setSync('offline'); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && appMode() === 'cloud' && Date.now() - lastPull > 20000) pull();
});

// ═════════════════════════════════════════════
// INSTALAÇÃO (PWA)
// ═════════════════════════════════════════════
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /android/i.test(navigator.userAgent);
function isStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
let installPrompt = null, bannerTimer = null;

function installDismissed() {
  try { return Date.now() - (+localStorage.getItem('fin_install_dismiss') || 0) < 21 * 864e5; } catch { return false; }
}
function maybeShowBanner() {
  if (isStandalone() || installDismissed()) return;
  if (!installPrompt && !isMobile) return;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => $('#install-banner').classList.add('show'), 2500);
}
function hideBanner() { clearTimeout(bannerTimer); $('#install-banner').classList.remove('show'); }
function dismissInstall() {
  try { localStorage.setItem('fin_install_dismiss', String(Date.now())); } catch {}
  hideBanner();
}
async function installApp() {
  hideBanner();
  if (installPrompt) {
    closeSheet();
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice;
    installPrompt = null;
    if (outcome !== 'accepted') dismissInstall();
  } else {
    openSheet('instalar');
  }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; maybeShowBanner(); });
window.addEventListener('appinstalled', () => { hideBanner(); toast('App instalado ✓'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // procura versão nova ao abrir e sempre que o app volta para a tela
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  });
  // quando uma versão nova é instalada, oferece atualizar
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    toast('Nova versão do app disponível', { label: 'Atualizar', fn: () => { reloading = true; location.reload(); } });
  });
}

// ═════════════════════════════════════════════
// INÍCIO
// ═════════════════════════════════════════════
loadSynced();
refresh();
setSync(appMode() === 'cloud' ? (navigator.onLine ? 'idle' : 'offline') : 'idle');
if (!appMode()) showAuth();
else if (isMobile && appMode() === 'local') maybeShowBanner();
loadCloudLib();
</script>
</body>
</html>
